dates: 2024-Present
title: Postdoctoral Research Fellow
institution: Shirley Ryan AbilityLab
department: Center for Bionic Medicine
details:
  - Worked in Dr. Arun Jayaraman's lab studying the effect of transcutaneous spinal cord stimulation (tSCS) on stroke and TBI patients
  - Provided technical expertise to the tech immersion clinic, collecting and analyzing sensor data to inform medically complex patients' care.
  - Provided care using tSCS to spinal cord injury tech immersion patients
  - Helped implement tSCS into hospital-wide standard clinical practice for SCI patients by informing stimulator device selection, designing and assisting with clinician education, monitoring rollout operations, and analyzing clinical tSCS-related outcomes.
